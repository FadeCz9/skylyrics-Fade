name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skylyrics-26.2-source/skylyrics-26.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5"
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: skylyrics-jar
          path: skylyrics-26.2-source/skylyrics-26.2/build/libs/skylyrics-*.jar
